<body>
<div class="wrap" id="app"><div class="loading">⛳ Carregando placares…</div></div>
<script>
"use strict";
/* ============== CONFIG ============== */
const SHEET_ID = "1rt4jNa5HFQecJhe2UOmD8Bd7FvZxxsTYCy23fBq_m-s";
// headers=1 é OBRIGATÓRIO: sem ele o gviz "adivinha" quantas linhas são cabeçalho e
// engole as linhas de jogadores que ainda não têm nenhum placar (some do app inteiro).
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&t=${Date.now()}`;
const DOUBLE_ROUND = 21;          // R21 conta em dobro
const TOP_N = 9;                  // contam 9 pontuações: da 2ª à 10ª melhor
const DROP_BEST = 1;              // descarta a MELHOR nota (R21 dobrada: sai só uma cópia) — vale desde a R1
const FEE = 50;                   // pingo por rodada
const LAST_PENALTY = 50;          // extra do último colocado
// Premiação diária BRUTA por nº de presentes: [1º, 2º, 3º, 4º]
const PRIZES = {4:[200,50],5:[200,100],6:[250,100],7:[250,150],8:[250,150,50],
  9:[300,150,50],10:[350,150,50],11:[350,200,50],12:[400,200,50],13:[400,200,100],
  14:[450,200,100],15:[450,250,100],16:[450,250,100,50]};
const SEASON_END = "19/12";
// Os 15 do grupo no 2º semestre 2026. QUALQUER outra linha do Sheet é tratada como
// convidado — assim basta escrever o nome dele na coluna A, sem sufixo nenhum.
// Mudou a lista de jogadores do semestre? Atualizar aqui.
const MEMBERS=["Barrichello","Beyruti","Caca","Claudio","Dega","Dudu","GAP","Gui Lopes",
  "Gui Rezende","Lut","Naves","Patrick","R Lisboa","Ricky C","Zillo"];
const MEMBER_SET=new Set(MEMBERS.map(n=>n.toLowerCase()));
// Linha de convidado no Sheet: nome com "(convidado)" OU começando com "Convidado".
// As linhas fixas "Convidado 1" / "Convidado 2" vivem sempre no fim do Sheet e
// ficam invisíveis no app enquanto estiverem sem placar em todas as rodadas.
const GUEST_RE = /\(convidado\)|^convidado\b/i;

/* ============== HELPERS ============== */
function parseCSV(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){row.push(cell);cell="";}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
      else if(ch!=='\r') cell+=ch;
    }
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function prizeList(n){
  if(n<2) return [];
  if(n<4){ // menos de 4: vencedor leva o pool inteiro
    return [(n-1)*FEE+FEE+LAST_PENALTY];
  }
  if(PRIZES[n]) return PRIZES[n].slice();
  // extrapolação acima de 16: +R$50 no 1º por jogador extra
  const base=PRIZES[16].slice();
  base[0]+= (n-16)*FEE;
  return base;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtMoney(v){
  const sign=v>0.009?"+":(v<-0.009?"−":"");
  return sign+"R$"+fmtBRL(Math.abs(v));
}
// mostra centavos só quando existem (empates podem dividir prêmio em valor quebrado)
function fmtBRL(v){
  const r=Math.round(v*100)/100;
  return Number.isInteger(r)?String(r):r.toFixed(2).replace(".",",");
}

// Rótulo limpo: tira o sufixo "(convidado)" do nome da linha
function cleanName(s){return String(s).replace(/\s*\(convidado\)\s*/i,"").trim();}
/* Célula de uma linha de convidado. Aceita, em ordem:
     "31"        -> pontos, sem nome (usa o rótulo da linha)
     "Zé 31"     -> nome + pontos  (formato recomendado)
     "31 Zé"     -> pontos + nome
   Separadores aceitos entre nome e pontos: espaço, ":", ",", "-", "–". */
function parseGuestCell(v){
  const s=String(v??"").trim();
  if(!s) return null;
  let m=s.match(/^(\d{1,3})$/);
  if(m) return {score:+m[1],name:null};
  m=s.match(/^(.+?)[\s:,\-–]+(\d{1,3})$/);
  if(m) return {score:+m[2],name:m[1].trim()};
  m=s.match(/^(\d{1,3})[\s:,\-–]+(.+)$/);
  if(m) return {score:+m[1],name:m[2].trim()};
  return null;
}

/* ============== CORE ============== */
function buildModel(rows){
  const header=rows[0];
  // colunas de rodada: "R1 01/08" ... "R21 19/12 (x2)"
  const rounds=[];
  for(let c=1;c<header.length;c++){
    const m=String(header[c]).match(/^R(\d+)\s+(\d{2}\/\d{2})/);
    if(m) rounds.push({col:c,num:+m[1],date:m[2],weight:+m[1]===DOUBLE_ROUND?2:1});
  }
  const parsed=[];
  for(let r=1;r<rows.length;r++){
    const raw=String(rows[r][0]||"").trim();
    if(!raw) continue;
    // convidado = qualquer linha que não seja um dos 15 do grupo
    const isGuest=GUEST_RE.test(raw)||!MEMBER_SET.has(cleanName(raw).toLowerCase());
    const guestNames=[];
    const scores=rounds.map(rd=>{
      const v=String(rows[r][rd.col]??"").trim();
      if(v===""){guestNames.push(null);return null;}
      if(isGuest){
        const g=parseGuestCell(v);
        guestNames.push(g?g.name:null);
        return g?g.score:null;
      }
      guestNames.push(null);
      const n=parseInt(v,10);
      return isNaN(n)?null:n;
    });
    // "Convidado 1" ainda sem nome trocado na coluna A
    const isPlaceholder=isGuest&&/^convidado\s*\d*$/i.test(cleanName(raw));
    parsed.push({name:raw,label:cleanName(raw),isGuest,isPlaceholder,guestNames,scores});
  }
  // linha fixa de convidado que ninguém usou não aparece em lugar nenhum do app
  const players=parsed.filter(p=>!p.isGuest||p.scores.some(s=>s!==null));
  // enrich: jogos ponderados, TOP9, média
  for(const p of players){
    const played=p.scores.map((s,i)=>[i,s]).filter(([,s])=>s!==null);
    p.jogos=played.reduce((a,[i])=>a+rounds[i].weight,0);
    const expanded=[];
    for(const [i,s] of played) for(let k=0;k<rounds[i].weight;k++) expanded.push([i,s]);
    const sortedExp=expanded.slice().sort((a,b)=>b[1]-a[1]);
    // regra 2º sem/2026: a melhor nota é descartada; contam da 2ª à 10ª.
    // Cada cópia da R21 é uma entrada separada, então só UMA cópia sai se ela for a melhor.
    const best=sortedExp.slice(0,DROP_BEST);
    const top=sortedExp.slice(DROP_BEST,DROP_BEST+TOP_N);
    const rest=sortedExp.slice(DROP_BEST+TOP_N);
    p.top9Idx=new Set(top.map(([i])=>i));
    // rodada cuja nota foi descartada como "melhor" — se for a R21, a outra cópia ainda conta
    p.bestIdx=new Set(best.filter(([i])=>!p.top9Idx.has(i)).map(([i])=>i));
    p.bestDiscarded=best.map(([i,s])=>({num:rounds[i].num,score:s}));
    p.counted=top.length;
    p.top9Sum=top.reduce((a,[,s])=>a+s,0);
    p.top9Min=top.length?Math.min(...top.map(([,s])=>s)):null;
    p.discarded=rest.map(([i,s])=>({num:rounds[i].num,score:s}))
      .sort((a,b)=>a.score-b.score||a.num-b.num);
    p.avgAll=played.length?played.reduce((a,[,s])=>a+s,0)/played.length:0;
    p.inDiscard=p.jogos>DROP_BEST+TOP_N-1;   // 10+ notas: cada nova só entra se superar a menor que conta
    // rótulo do convidado = os nomes que realmente apareceram nas células
    if(p.isGuest){
      const usados=[...new Set(p.guestNames.filter(Boolean))];
      if(usados.length) p.label=usados.join(" · ");
    }
  }
  // nome exibido de um jogador NA RODADA i (convidado troca de nome a cada rodada)
  function dispName(p,i){
    return (p.isGuest&&p.guestNames[i])?p.guestNames[i]:p.label;
  }
  // resultados por rodada + saldos
  for(const p of players){p.balance=0;p.lastCount=0;p.prizeTotal=0;}
  const roundResults=[];
  rounds.forEach((rd,i)=>{
    const present=players.filter(p=>p.scores[i]!==null);
    if(!present.length) return;
    const n=present.length;
    const sorted=present.slice().sort((a,b)=>b.scores[i]-a.scores[i]);
    const prizes=prizeList(n);
    // agrupa por pontuação (empates)
    const groups=[];
    for(const p of sorted){
      const g=groups[groups.length-1];
      if(g&&g.score===p.scores[i]) g.players.push(p);
      else groups.push({score:p.scores[i],players:[p]});
    }
    let pos=1;const podium=[];
    // nome de exibição único dentro da rodada (dois convidados homônimos viram "Zé" e "Zé (2)")
    const nm=new Map(),vistos=new Set();
    for(const p of present){
      let d=dispName(p,i);const base=d;let k=2;
      while(vistos.has(d)) d=base+" ("+(k++)+")";
      vistos.add(d);nm.set(p,d);
    }
    // líquido da rodada por jogador (prêmio bruto − pingo − penalidade do último)
    const net={},detail={};
    for(const p of present){ net[nm.get(p)]=-FEE; detail[nm.get(p)]={pos:0,score:p.scores[i],gross:0,fee:FEE,pen:0,guest:p.isGuest}; }
    for(const g of groups){
      const span=g.players.length;
      // prêmios das posições pos..pos+span-1 somados e divididos
      let pot=0;
      for(let k=pos;k<pos+span;k++) pot+=(prizes[k-1]||0);
      const each=pot/span;
      for(const p of g.players){
        const key=nm.get(p);
        p.balance+=each; p.prizeTotal+=each;
        net[key]+=each; detail[key].gross=each; detail[key].pos=pos; detail[key].tie=span>1;
        if(pos<=4&&each>0) podium.push({pos,name:key,score:g.score,prize:each,tie:span>1});
      }
      pos+=span;
    }
    // pingo
    for(const p of present) p.balance-=FEE;
    // último colocado (empate no último: penalidade dividida)
    const lastGroup=groups[groups.length-1];
    for(const p of lastGroup.players){
      const pen=LAST_PENALTY/lastGroup.players.length;
      p.balance-=pen; p.lastCount++;
      net[nm.get(p)]-=pen; detail[nm.get(p)].pen=pen;
    }
    roundResults.push({num:rd.num,date:rd.date,n,podium,net,detail,
      transfers:settle(net),
      guestsIn:present.filter(p=>p.isGuest).map(p=>({name:nm.get(p),score:p.scores[i],
        ph:p.isPlaceholder&&!p.guestNames[i],cellName:!!p.guestNames[i]})),
      last:lastGroup.players.map(p=>nm.get(p)),lastTie:lastGroup.players.length>1});
  });
  return {rounds,players,roundResults};
}

/* Converte líquidos em transferências mínimas: quem paga quem.
   Mesma lógica do settle() em financeiro.py — mantidos em sincronia. */
function settle(net){
  const debt=Object.entries(net).filter(([,v])=>v<-1e-9).map(([n,v])=>[n,-v]).sort((a,b)=>b[1]-a[1]);
  const cred=Object.entries(net).filter(([,v])=>v>1e-9).map(([n,v])=>[n,v]).sort((a,b)=>b[1]-a[1]);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const amt=Math.min(debt[i][1],cred[j][1]);
    out.push({from:debt[i][0],to:cred[j][0],amount:Math.round(amt*100)/100});
    debt[i][1]-=amt; cred[j][1]-=amt;
    if(debt[i][1]<1e-9) i++;
    if(cred[j][1]<1e-9) j++;
  }
  return out;
}

/* ============== RENDER ============== */
function render(model){
  const {rounds,players,roundResults}=model;
  const lastRound=roundResults.length?roundResults[roundResults.length-1]:null;
  const members=players.filter(p=>!p.isGuest);
  const guests=players.filter(p=>p.isGuest);
  const ranked=members.slice().sort((a,b)=>b.top9Sum-a.top9Sum||b.avgAll-a.avgAll);
  let h="";
  // Header
  const sub=lastRound
    ? `Atualizado após R${lastRound.num} (${lastRound.date}) · ${lastRound.n} jogadores presentes`
    : "Pré-temporada · R1 em 01/08/2026 · 21 etapas até "+SEASON_END;
  h+=`<div class="hdr"><h1>🏌️ Sweep Golf — 2º Semestre 2026</h1><div class="sub">${sub}</div></div>`;
  // Card "Destaque da Rodada" aposentado em 07/08/2026 (pedido do Rick) —
  // era redundante com o Acerto da Rodada. Pódio, pontos e nota de convidado
  // agora vivem dentro do card de Acerto.
  // Acerto de contas da rodada — quem paga quem
  if(lastRound){
    const guestNotes=(lastRound.guestsIn||[]).map(g=>{
      const dica=g.ph
        ? ` <b>Troque "${esc(g.name)}" pelo nome dele na coluna A da planilha.</b>`
        : "";
      const risco=g.cellName
        ? `<div class="guest gwarn">⚠️ O nome de <b>${esc(g.name)}</b> está escrito dentro da célula da rodada. `+
          `O Google só devolve texto enquanto a coluna não tiver virado numérica — quando virar, esse convidado `+
          `<b>some do rateio sozinho</b>. Mova o nome para a coluna A da linha de convidado.</div>`
        : "";
      return `<div class="guest">👤 ${esc(g.name)} jogou a R${lastRound.num} como convidado, com ${g.score} pts — `+
             `entra no rateio do dia, fora do Ranking.${dica}</div>${risco}`;
    }).join("");
    const t=lastRound.transfers;
    let pays = t.length
      ? t.map(x=>`<div class="pay"><span class="from">${esc(x.from)}</span>`+
          `<span class="arw">paga</span><span class="amt">R$${fmtBRL(x.amount)}</span>`+
          `<span class="arw">para</span><span class="to">${esc(x.to)}</span></div>`).join("")
      : `<div class="nopay">Ninguém deve nada nesta rodada.</div>`;
    // detalhe por jogador
    const ent=Object.entries(lastRound.detail).sort((a,b)=>a[1].pos-b[1].pos||b[1].score-a[1].score);
    let drows="";
    for(const [name,d] of ent){
      const n=lastRound.net[name];
      drows+=`<tr><td>${esc(name)}${d.guest?' <span class="chip gst">👤</span>':""}${d.tie?' <span class="chip">emp.</span>':""}</td>`+
        `<td class="z">${d.pos}º</td>`+
        `<td class="z">${d.score}</td>`+
        `<td class="${d.gross>0?"g":"z"}">${d.gross>0?"R$"+fmtBRL(d.gross):"—"}</td>`+
        `<td class="n">−R$${fmtBRL(d.fee+d.pen)}</td>`+
        `<td class="${n>0.009?"p":(n<-0.009?"n":"z")}">${fmtMoney(n)}</td></tr>`;
    }
    const soma=Object.values(lastRound.net).reduce((a,b)=>a+b,0);
    h+=`<div class="card"><h2>💸 Acerto da Rodada R${lastRound.num}</h2>${pays}${guestNotes}`+
      `<details class="dtl"><summary>Ver o cálculo jogador a jogador</summary>`+
      `<table><thead><tr><th>Jogador</th><th>Pos</th><th>Pts</th><th>Prêmio</th><th>Pingo</th><th>Líquido</th></tr></thead>`+
      `<tbody>${drows}</tbody></table>`+
      `<div class="zsum">Pingo = R$${FEE} de cada um; o último paga mais R$${LAST_PENALTY} (dividido em caso de empate). `+
      `Soma dos líquidos: <b>R$${Math.round(soma)}</b> ${Math.abs(soma)<0.01?"✅ fecha em zero":"⚠️ NÃO fecha — avisar o Rick"}.</div>`+
      `</details></div>`;
  }
  // Aviso: algum dos 15 do grupo sumiu do Sheet (típico de erro de digitação na coluna A)
  {
    const vistos=new Set(members.map(p=>p.label.toLowerCase()));
    const faltando=MEMBERS.filter(n=>!vistos.has(n.toLowerCase()));
    if(faltando.length){
      h+=`<div class="card"><h2>⚠️ Conferir a planilha</h2><div class="guest gwarn">`+
        `Não achei no Sheet: <b>${faltando.map(esc).join(", ")}</b>. `+
        `Provavelmente o nome na coluna A foi alterado — quem não bate com a lista do grupo `+
        `é tratado como convidado e sai do Ranking.</div></div>`;
    }
  }
  // Ranking TOP9
  {
    let cells=`<div class="hdr-cell pos">#</div><div class="hdr-cell">Jogador</div>`+
      `<div class="hdr-cell score">Pts</div><div class="hdr-cell j">Jogos</div><div class="hdr-cell avg">Média</div>`;
    ranked.forEach((p,idx)=>{
      const chip=p.inDiscard?'<span class="chip">⚡</span>':"";
      const avg=p.counted?(p.top9Sum/p.counted).toFixed(1):"—";
      cells+=`<div class="cell pos">${idx+1}</div><div class="cell">${esc(p.label)}${chip}</div>`+
        `<div class="cell score">${p.top9Sum}</div><div class="cell j">${p.jogos}</div><div class="cell avg">${avg}</div>`;
    });
    h+=`<div class="card"><h2>📊 Ranking — 2ª à 10ª nota</h2><div class="legend">Descarta a melhor nota de cada um; contam as 9 seguintes. Média = média das notas que contam.</div><div class="rank">${cells}</div></div>`;
  }
  // Grade de pontuações
  {
    let ths="<th>Jogador</th>";
    rounds.forEach(rd=>{ths+=`<th class="num"><span class="rlabel">R${rd.num}${rd.weight>1?" ×2":""}</span><span class="rdate">${rd.date}</span></th>`;});
    ths+='<th class="num avg-col"><span class="rlabel">Média</span><span class="rdate">todos</span></th>';
    let body="";
    for(const p of [...ranked,...guests]){
      const lbl=p.isGuest?`${esc(p.label)} <span class="chip gst">convidado</span>`:esc(p.label);
      let tds=`<td>${lbl}</td>`;
      p.scores.forEach((s,i)=>{
        // convidado não disputa o campeonato: nunca destacar como "conta pro TOP 9"
        const hl=!p.isGuest&&p.top9Idx.has(i);
        const bx=!p.isGuest&&p.bestIdx.has(i);
        tds+=s===null?'<td class="num">—</td>':`<td class="num${hl?" count":""}${bx?" best":""}">${s}</td>`;
      });
      tds+=p.jogos>0?`<td class="num avg-col">${p.avgAll.toFixed(1)}</td>`:'<td class="num avg-col">—</td>';
      body+=`<tr>${tds}</tr>`;
    }
    h+=`<div class="card"><h2>📋 Pontuações por Rodada</h2><div class="scroll"><table><thead><tr>${ths}</tr></thead><tbody>${body}</tbody></table></div>`+
      `<div class="legend"><span class="hl">destacadas</span> = notas que contam (da 2ª à 10ª melhor) · <span class="bx">azul</span> = melhor nota de cada um (descartada) · Média = média de todas as rodadas jogadas</div></div>`;
  }
  // Modo descarte
  {
    // só quem já tem 10+ notas — a melhor descartada de todos aparece riscada na grade
    const disc=ranked.filter(p=>p.inDiscard);
    if(disc.length){
      let rows="";
      for(const p of disc){
        const b=p.bestDiscarded.map(d=>`${d.score} (R${d.num}${d.num===DOUBLE_ROUND?", 1 cópia":""})`).join(", ");
        const outras=p.discarded.length
          ?` + ${p.discarded.map(d=>`${d.score} (R${d.num})`).join(", ")} por excesso`
          :"";
        const meta=p.inDiscard
          ?`Menor que conta = ${p.top9Min}. Precisa superar <b>${p.top9Min}</b> pra melhorar.`
          :`Ainda com ${p.counted} de 9 notas contando — qualquer rodada soma.`;
        rows+=`<div class="bullet"><b>${esc(p.name)}</b> (${p.jogos} rod.) — descartando a melhor: ${b}${outras}. ${meta}</div>`;
      }
      h+=`<div class="card"><h2>⚡ Modo Descarte</h2>${rows}</div>`;
    }
  }
  // Histórico de rodadas
  if(roundResults.length>1){
    let rows="";
    for(const r of roundResults.slice().reverse()){
      const winners=r.podium.filter(p=>p.pos===1).map(p=>esc(p.name)).join(" e ");
      rows+=`<div class="bullet"><b>R${r.num}</b> (${r.date}, ${r.n} presentes): 🥇 ${winners} · 🔻 ${r.last.map(esc).join(" e ")}</div>`;
    }
    h+=`<div class="card"><h2>🗓️ Rodadas Anteriores</h2>${rows}</div>`;
  }
  // Regra de distribuição — calculadora sempre disponível
  {
    // abre já preenchida com a rodada mais recente, separando grupo x convidados
    const gDefault = lastRound ? (lastRound.guestsIn||[]).length : 0;
    const nDefault = lastRound ? lastRound.n - gDefault : 8;
    h+=`<div class="card"><details class="rules" id="rulesCard">
<summary>📖 Regra de distribuição do Sweep</summary>
<div class="calc">
  <div class="lbl">Quantos do grupo jogaram?</div>
  <div class="stepper">
    <button type="button" id="pMinus" aria-label="menos">−</button>
    <input type="number" id="pN" min="0" max="40" step="1" value="${nDefault}" inputmode="numeric">
    <button type="button" id="pPlus" aria-label="mais">+</button>
    <span class="un">do grupo</span>
  </div>
  <div class="lbl">👤 Convidados na rodada</div>
  <div class="stepper">
    <button type="button" id="gMinus" aria-label="menos convidados">−</button>
    <input type="number" id="gN" min="0" max="10" step="1" value="${gDefault}" inputmode="numeric">
    <button type="button" id="gPlus" aria-label="mais convidados">+</button>
    <span class="un">convidado(s)</span>
  </div>
  <div class="tot" id="pTot"></div>
  <div id="pOut"></div>
</div>
</details></div>`;
  }
  // Próxima rodada
  {
    let next="🏁 Temporada encerrada";
    const today=new Date();
    for(const rd of rounds){
      const [d,m]=rd.date.split("/").map(Number);
      const dt=new Date(2026,m-1,d);
      const hasScore=players.some(p=>p.scores[rounds.indexOf(rd)]!==null);
      if(!hasScore&&dt>=new Date(today.getFullYear(),today.getMonth(),today.getDate())){
        next=`Próxima rodada: R${rd.num} — ${rd.date}${rd.weight>1?" (conta em dobro!)":""} 🏌️`;
        break;
      }
    }
    const now=new Date();
    h+=`<div class="footer">${next}<br>Dados ao vivo do Google Sheets · carregado ${now.toLocaleDateString("pt-BR")} ${now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</div>`;
  }
  document.getElementById("app").innerHTML=h;
  wireRulesCalc();
}

/* ====== Calculadora da regra de distribuição ====== */
function wireRulesCalc(){
  const inp=document.getElementById("pN"), gInp=document.getElementById("gN"),
        out=document.getElementById("pOut"), tot=document.getElementById("pTot");
  if(!inp||!gInp||!out||!tot) return;
  function draw(){
    let m=parseInt(inp.value,10); if(isNaN(m)||m<0) m=0; if(m>40) m=40;
    let g=parseInt(gInp.value,10); if(isNaN(g)||g<0) g=0; if(g>10) g=10;
    let n=m+g; if(n>40) n=40;
    tot.innerHTML = g>0
      ? `Total na rodada: <b>${m} do grupo + ${g} convidado${g>1?"s":""} = ${n} jogadores</b>.`+
        `<br>Convidado conta igual a todo mundo: paga o pingo, pode levar prêmio e pode ser o último. Só não entra no Ranking.`
      : `Total na rodada: <b>${n} jogador${n===1?"":"es"}</b>.`;
    if(n<2){
      out.innerHTML=`<div class="chk">Precisa de pelo menos 2 jogadores pra ter rateio.</div>`;
      return;
    }
    const pr=prizeList(n), pool=n*FEE+LAST_PENALTY;
    const dist=pr.reduce((a,b)=>a+b,0);
    let rows="";
    for(let i=0;i<pr.length;i++){
      const net=pr[i]-FEE;
      rows+=`<tr><td>${i+1}º</td><td class="g">R$${pr[i]}</td>`+
            `<td class="${net>0?"p":(net<0?"n":"")}">${fmtMoney(net)}</td></tr>`;
    }
    if(n-pr.length-1>0){
      rows+=`<tr class="dim"><td>${pr.length+1}º a ${n-1}º</td><td>—</td><td class="n">−R$${FEE}</td></tr>`;
    }
    if(n>pr.length){
      rows+=`<tr><td>Último 🔻</td><td>—</td><td class="n">−R$${FEE+LAST_PENALTY}</td></tr>`;
    }
    let html=`<table class="ptab"><thead><tr><th>Posição</th><th>Prêmio bruto</th><th>No bolso</th></tr></thead><tbody>${rows}</tbody></table>`;
    html+=`<div class="chk">Arrecadado: <b>${n} × R$${FEE}</b> de pingo + <b>R$${LAST_PENALTY}</b> de penalidade do último = <b>R$${pool}</b>`+
          `<br>Distribuído em prêmios: <b>R$${dist}</b> ${dist===pool?"✅ fecha certinho":"⚠️ NÃO fecha — avisar o Rick"}`+
          `<br><b>No bolso</b> = prêmio bruto menos os R$${FEE} do pingo. Empate: soma os prêmios das posições empatadas e divide igual. Empate no último: divide a penalidade de R$${LAST_PENALTY}.</div>`;
    if(n<4||n>16){
      html+=`<div class="warn">⚠️ Fora da tabela oficial (4 a 16 jogadores) — valores extrapolados pelo padrão. Confirmar com o grupo.</div>`;
    }
    if(g>0){
      html+=`<div class="warn">👤 Pra esse rateio valer pro grupo todo, o convidado precisa entrar na planilha, `+
            `em <b>dois lugares</b> da linha <b>Convidado 1</b> (ou <b>Convidado 2</b>):<br>`+
            `1) o <b>nome</b> dele na <b>coluna A</b>, por cima de "Convidado 1" (pode ser só o primeiro nome);<br>`+
            `2) os <b>pontos</b> (só o número) na coluna da rodada.<br>`+
            `O app faz o resto.</div>`;
    }
    out.innerHTML=html;
  }
  const step=(el,d,min,max)=>{ el.value=Math.min(max,Math.max(min,(parseInt(el.value,10)||0)+d)); draw(); };
  document.getElementById("pMinus").onclick=()=>step(inp,-1,0,40);
  document.getElementById("pPlus").onclick=()=>step(inp,1,0,40);
  document.getElementById("gMinus").onclick=()=>step(gInp,-1,0,10);
  document.getElementById("gPlus").onclick=()=>step(gInp,1,0,10);
  inp.oninput=draw; gInp.oninput=draw;
  draw();
}

/* ============== BOOT ============== */
fetch(CSV_URL)
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
  .then(text=>{
    const rows=parseCSV(text);
    // igualdade exata, não prefixo: "Jogador Barrichello Beyruti Caca" (header inflado
    // pelo gviz) passava no teste antigo e o app perdia jogadores em silêncio.
    if(!rows.length||String(rows[0][0]).trim().toLowerCase()!=="jogador")
      throw new Error("Formato inesperado da planilha: célula A1 = \""+String(rows[0]&&rows[0][0]).slice(0,60)+"\"");
    render(buildModel(rows));
  })
  .catch(err=>{
    document.getElementById("app").innerHTML=
      `<div class="error">⚠️ Não consegui carregar os placares.<div class="hint">`+
      `Verifique a conexão e tente recarregar a página.<br>`+
      `(Organizador: o Google Sheet precisa estar compartilhado como "qualquer pessoa com o link — leitor".)<br>`+
      `<code style="font-size:10px">${esc(err.message)}</code></div></div>`;
  });
</script>
